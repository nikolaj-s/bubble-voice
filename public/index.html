<!DOCTYPE html>
<html lang="en">
  <head>
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble – Open & Fun Micro Communities</title>
  <meta name="description" content="Bubble is an open and fun platform for creating micro communities. Connect, chat, and share in small, dynamic communities.">
  <meta name="keywords" content="Bubble, social platform, communities, micro communities, chat, online community, social app">
  <meta name="author" content="Bubble">

  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="Bubble – Open & Fun Micro Communities">
  <meta property="og:description" content="Bubble is an open and fun platform for creating micro communities. Connect, chat, and share in small, dynamic communities.">
  <meta property="og:image" content="https://bubble-media.net/uploads/2192b730-c7c9-4663-bb7c-8d3024b743df.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bubblevoice.net/"> <!-- Replace with your live URL -->
  <meta property="og:site_name" content="Bubble">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Bubble – Open & Fun Micro Communities">
  <meta name="twitter:description" content="Bubble is an open and fun platform for creating micro communities. Connect, chat, and share in small, dynamic communities.">
  <meta name="twitter:image" content="https://bubble-media.net/uploads/2192b730-c7c9-4663-bb7c-8d3024b743df.png">


  <!-- PWA / Mobile -->
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-title" content="Bubble">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Canonical -->
  <link rel="canonical" href="https://bubble.com/">

  <!-- Optional: Fonts / Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

</head>

  </body>
</html>
